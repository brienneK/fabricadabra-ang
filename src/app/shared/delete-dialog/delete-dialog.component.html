<h1 mat-dialog-title>Confirm {{ operation() }}</h1>
<mat-dialog-content>
  <p>
    This action cannot be undone. Are you sure you want to
    {{ operation().toLowerCase() }} {{ target() }}?
  </p>
</mat-dialog-content>
<mat-dialog-actions>
  <button
    mat-raised-button
    type="button"
    class="btn-delete"
    [mat-dialog-close]="true"
  >
    {{ operation() }}
  </button>
  <button
    mat-stroked-button
    type="button"
    class="btn-cancel"
    [mat-dialog-close]="false"
  >
    Cancel
  </button>
</mat-dialog-actions>
