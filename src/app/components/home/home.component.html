<div class="container mt-3">
  <h1>Welcome to Fabricadabra</h1>
  <p>A magical place to keep a sewist's stash organized.</p>
  <div>
    @if (!isLoggedIn()) {
    <a
      mat-raised-button
      class="btn-primary mb-4"
      type="button"
      routerLink="/login"
    >
      Login or sign up now for a free account
    </a>
    } @else {
    <p>You're logged in!</p>
    }
  </div>
</div>
