<mat-accordion>
  <mat-expansion-panel
    (opened)="panelOpenState.set(true)"
    (closed)="panelOpenState.set(false)"
  >
    <mat-expansion-panel-header>
      <h3>Sources</h3>
    </mat-expansion-panel-header>
    <div class="sources-list">
      @if (filteredSources().length > 0) {
      <div class="options-container">
        @for (source of filteredSources(); track source.id) {
        <button mat-list-item class="option-item" (click)="onClick(source)">
          {{ source.name }}
        </button>
        }
      </div>
      } @else {
      <p class="no-sources">No sources found</p>
      }
    </div>
    <div>
      <div class="sources-actions">
        <mat-slide-toggle
          #activeToggle
          [checked]="true"
          [(ngModel)]="activeOnly"
        >
          Active only
        </mat-slide-toggle>
        <button mat-raised-button class="btn-primary" (click)="addSource()">
          Add Source
        </button>
      </div>
    </div>
  </mat-expansion-panel>
</mat-accordion>
