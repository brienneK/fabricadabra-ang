<h1 mat-dialog-title>Edit Color</h1>
<form [formGroup]="editColorForm">
  <mat-dialog-content>
    <div class="content">
      <mat-form-field appearance="fill">
        <mat-label>Color name</mat-label>
        <input matInput formControlName="colorName" />
        @if (f.colorName.errors?.['required']) {
        <mat-error> *Required </mat-error>
        }
      </mat-form-field>
    </div>
    <div class="toggle">
      <mat-slide-toggle formControlName="active">Active</mat-slide-toggle>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button
      mat-stroked-button
      type="button"
      class="btn-cancel"
      [disabled]="editColorForm.disabled"
      [mat-dialog-close]="{ success: false }"
    >
      Cancel
    </button>
    <button
      mat-raised-button
      type="button"
      class="btn-delete"
      [disabled]="editColorForm.disabled"
      (click)="deleteColor()"
    >
      Delete
    </button>
    <button
      mat-raised-button
      class="btn-primary"
      type="submit"
      defaultButton
      [disabled]="
        !editColorForm.valid || editColorForm.pristine || editColorForm.disabled
      "
      (click)="onSubmit()"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
