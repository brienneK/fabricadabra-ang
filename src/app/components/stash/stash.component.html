<header>
  <div class="stash-header">
    <h1>My Stash</h1>
    <a mat-flat-button routerLink="/add-fabric">Add fabric</a>
  </div>
</header>
<main>
  <div class="table-container">
    <div class="scrollable-table mat-elevation-z8">
      <table
        mat-table
        matSort
        [dataSource]="filteredFabrics()"
        (matSortChange)="sortFabrics($event)"
        multiTemplateDataRows
        class="static-table"
      >
        <ng-container matColumnDef="fiber">
          <th mat-header-cell *matHeaderCellDef>Fiber</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.fiber }}</td>
        </ng-container>
        <ng-container matColumnDef="material">
          <th mat-header-cell *matHeaderCellDef>Material</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.material }}</td>
        </ng-container>
        <ng-container matColumnDef="pattern">
          <th mat-header-cell *matHeaderCellDef>Pattern</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.pattern }}</td>
        </ng-container>
        <ng-container matColumnDef="color">
          <th mat-header-cell *matHeaderCellDef>Color</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.color }}</td>
        </ng-container>
        <ng-container matColumnDef="width">
          <th mat-header-cell *matHeaderCellDef>Width</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.width }}</td>
        </ng-container>
        <ng-container matColumnDef="length">
          <th mat-header-cell *matHeaderCellDef>Length</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.length }}</td>
        </ng-container>
        <ng-container matColumnDef="scrap">
          <th mat-header-cell *matHeaderCellDef>Scrap</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.scrap }}</td>
        </ng-container>
        <ng-container matColumnDef="source">
          <th mat-header-cell *matHeaderCellDef>Source</th>
          <td mat-cell *matCellDef="let fabric">{{ fabric.source }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
  <div class="add-fabric-button"></div>
</main>
